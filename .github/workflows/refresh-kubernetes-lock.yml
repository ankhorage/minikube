name: Refresh Kubernetes dependency lock

on:
  push:
    branches:
      - fix/6-kubernetes-readiness-driver

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Refresh dependency lock
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile
          node -e "const version=require('./node_modules/@ankhorage/kubernetes/package.json').version; if (version !== '0.7.2') throw new Error('Expected @ankhorage/kubernetes 0.7.2, got ' + version);"

      - name: Commit refreshed lock
        run: |
          rm .github/workflows/refresh-kubernetes-lock.yml
          git add bun.lock .github/workflows/refresh-kubernetes-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Kubernetes dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
